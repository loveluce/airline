const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function rand(g){g.rng=(Math.imul(g.rng,1664525)+1013904223)>>>0;return g.rng/4294967296;}
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function pairKey(a,b){return [a,b].sort().join('-');}
const DIST_CACHE={};
function distance(a,b){const k=pairKey(a,b);if(DIST_CACHE[k]!=null)return DIST_CACHE[k];const x=AP[a],y=AP[b],rad=Math.PI/180;const dlat=(y.lat-x.lat)*rad,dlon=(y.lon-x.lon)*rad;const z=Math.sin(dlat/2)**2+Math.cos(x.lat*rad)*Math.cos(y.lat*rad)*Math.sin(dlon/2)**2;return DIST_CACHE[k]=Math.round(6371*2*Math.asin(Math.sqrt(clamp(z,0,1))));}
function fares(a,b){const d=distance(a,b),f=Math.round(38+.095*d);return [f,Math.round(f*2.85),Math.round(f*5.2)];}
function tripHours(type,a,b){return 2*(distance(a,b)/TP[type].speed+.18+TP[type].turn);}
function seatDefault(t){const j=t.seats>250?24:t.seats>100?8:0,f=t.seats>300?4:0;return [t.seats-2*j-4*f,j,f];}
function makePlane(g,type,base,kind='owned',condition=98,readyWeek=0,paid=null){const t=TP[type];const id='p'+g.nextId++;return {id,type,base,kind,condition,readyWeek,maintenanceUntil:0,age:kind==='used'?208:0,seats:seatDefault(t),deposit:kind==='lease'?Math.round(t.price*.07):0,paid:paid===null?t.price:paid,acquired:g.week,lease:kind==='lease'?t.lease:0,totalHours:0,registration:'SW-'+id.slice(1).padStart(3,'0')};}
function isAvailable(p,w){return p.readyWeek<=w&&p.maintenanceUntil<=w&&p.condition>35;}
function usedHours(g,pid,excludeId=null){return g.routes.filter(r=>r.active&&r.id!==excludeId).reduce((v,r)=>v+r.assignments.filter(x=>x.plane===pid).reduce((n,x)=>{const p=g.fleet.find(p=>p.id===pid);return n+(p?tripHours(p.type,r.a,r.b)*x.freq:0);},0),0);}
function planeValue(p){const t=TP[p.type];return p.kind==='lease'?p.deposit:Math.round(t.price*.67*(.62+.38*p.condition/100)*Math.max(.42,1-p.age*.0006));}
function equity(g){return g.cash+g.fleet.reduce((n,p)=>n+planeValue(p),0)+g.hubs.reduce((n,h)=>n+(h.primary?0:h.cost*.5),0)-g.debt;}
function creditLimit(g){const owned=g.fleet.filter(p=>p.kind!=='lease').reduce((n,p)=>n+planeValue(p),0);return Math.max(5000000,Math.floor((owned*.65+g.reputation*70000)/1000000)*1000000);}
function hubSlots(g,id){return (g.hubs.find(h=>h.id===id)?.level||0)*56;}
function hubUsed(g,id,excludeId=null){return g.routes.filter(r=>r.a===id&&r.active&&r.id!==excludeId).reduce((n,r)=>n+r.assignments.reduce((a,x)=>a+x.freq,0),0);}
function hubCost(id){return 2000000+AP[id].market*450000;}
function routeOpeningCost(a,b){return 100000+distance(a,b)*22;}
function maintenanceCost(p){return Math.round(TP[p.type].price*(.0025+(100-p.condition)*.000045));}
function eventFactor(g,r,kind){return g.events.filter(e=>e.until>=g.week+1&&(!e.airport||e.airport===r.a||e.airport===r.b)&&(!e.region||AP[r.a].region===e.region||AP[r.b].region===e.region)).reduce((v,e)=>v*(e[kind]||1),1);}
function marketDemand(g,a,b){const x=AP[a],y=AP[b],d=distance(a,b),sameRegion=x.region===y.region,local=x.country===y.country;const season=1+.10*Math.sin((g.week+hash(pairKey(a,b))%52)/52*Math.PI*2);const base=Math.sqrt(x.market*y.market)*660*(.71+.70*Math.exp(-d/3000))*(sameRegion?1.14:1)*(local?1.15:1)*(d<180?.5:1);const econ=DIFFICULTY[g.difficulty].demand;const all=Math.round(base*season*econ*eventFactor(g,{a,b},'demand'));const business=.095+Math.min(x.market,y.market)*.004,first=(d>5000?.025:.012);return [Math.round(all*(1-business-first)),Math.round(all*business),Math.round(all*first)];}
function competitorOffers(g,a,b){const key=pairKey(a,b);return g.ai.flatMap(c=>c.routes.filter(r=>pairKey(r.a,r.b)===key).map(r=>({...r,owner:c.id,rep:c.reputation})));}
function routeCapacity(g,r,w=g.week+1){const caps=[0,0,0];let seats=0,scheduled=0,legs=0,hours=0,fuel=0,aircraftMaintenance=0,operational=0;for(const x of r.assignments){const p=g.fleet.find(p=>p.id===x.plane);if(!p)continue;const t=TP[p.type],raw=x.freq*2;scheduled+=raw;seats+=p.seats.reduce((n,s)=>n+s,0)*raw;if(!r.active||!isAvailable(p,w))continue;const reliability=clamp(.965+(p.condition-80)*.0007,.85,.995)*eventFactor(g,r,'reliability');const flights=raw*reliability;legs+=flights;operational+=raw;for(let k=0;k<3;k++)caps[k]+=p.seats[k]*flights;const airborne=distance(r.a,r.b)/t.speed+.18;const block=airborne+t.turn;hours+=block*flights;fuel+=airborne*flights*t.burn*(1-g.upgrades.fuel*.04)*(1+(100-p.condition)*.0015)*g.fuel;aircraftMaintenance+=flights*block*t.fixed*.075;}return {caps,seats,scheduled,legs,hours,fuel,aircraftMaintenance,operational};}
function chooseWeight(price,base,rep,service,freq,k,upgrade=0){const elasticity=[2.9,2.2,1.7][k];const priceFactor=Math.exp(clamp(-elasticity*(price/base-1),-10,4));const quality=(.58+rep/100*.6)*Math.pow(SERVICES[service].quality,k===0?.55:1.5)*(1+upgrade*.05);const frequency=.63+.37*Math.min(1,freq/14);return priceFactor*quality*frequency;}
/* Capacity-constrained market allocation: all airlines share one market.
 * Demand not choosing an airline is retained by an outside alternative.
 * Overflow from full aircraft is redistributed, never double-counted. */
function allocateMarket(g,a,b,override=null){
 const base=fares(a,b),market=marketDemand(g,a,b),rivals=competitorOffers(g,a,b),r=override||g.routes.find(x=>pairKey(x.a,x.b)===pairKey(a,b));
 const offers=rivals.map(c=>({id:c.owner,cap:c.seats.map(v=>v*c.freq*2*.97*eventFactor(g,c,'reliability')),weights:[0,1,2].map(k=>chooseWeight(c.prices[k],base[k],c.rep,c.service,c.freq,k)*DIFFICULTY[g.difficulty].ai)}));
 if(r&&r.active){const cap=routeCapacity(g,r),freq=r.assignments.reduce((n,x)=>n+x.freq,0),connections=g.routes.filter(x=>x.active&&x.a===r.a&&x.id!==r.id).length+1,boost=1+Math.min(.30,Math.max(0,connections-1)*(.009+g.upgrades.network*.004));offers.push({id:'player',cap:cap.caps,weights:[0,1,2].map(k=>chooseWeight(r.prices[k],base[k],g.reputation,r.service,freq,k,g.upgrades.service)*(1+g.marketing*.012)*boost)});}
 const result=Object.fromEntries(offers.map(o=>[o.id,[0,0,0]]));
 for(let k=0;k<3;k++){let remaining=market[k];let active=offers.filter(o=>o.cap[k]>0).map(o=>({id:o.id,cap:o.cap[k],weight:o.weights[k]}));active.push({id:'outside',cap:Infinity,weight:.64});
  while(remaining>.0001&&active.length){const sum=active.reduce((n,o)=>n+o.weight,0),full=active.filter(o=>remaining*o.weight/sum>=o.cap);if(!full.length){for(const o of active)if(o.id!=='outside')result[o.id][k]+=remaining*o.weight/sum;break;}for(const o of full){if(o.id!=='outside')result[o.id][k]+=o.cap;remaining-=o.cap;}const done=new Set(full.map(o=>o.id));active=active.filter(o=>!done.has(o.id));}
 }
 for(const id of Object.keys(result))result[id]=result[id].map(v=>Math.max(0,Math.floor(v)));
 return {market,passengers:result};
}
function routeStats(g,r){const cap=routeCapacity(g,r),allocation=allocateMarket(g,r.a,r.b,r),market=allocation.market,rivals=competitorOffers(g,r.a,r.b);const passengers=allocation.passengers.player||[0,0,0],load=passengers.map((n,k)=>cap.caps[k]?n/cap.caps[k]:0);let revenue=passengers.reduce((n,v,k)=>n+v*r.prices[k],0);const pax=passengers.reduce((n,v)=>n+v,0);const ancillary=pax*(r.service===0?10:r.service===1?7:3);revenue+=ancillary;const fuel=cap.fuel;const airport=cap.legs*(AP[r.a].fee+AP[r.b].fee)/2;const service=passengers.reduce((n,v,k)=>n+v*SERVICES[r.service].cost*[1,2.7,5.0][k],0);const gate=r.active?4500+Math.min(AP[r.a].market,AP[r.b].market)*550:0;const cost=fuel+airport+service+cap.aircraftMaintenance+gate;return {revenue,cost,profit:revenue-cost,pax,passengers,load,capacity:cap.caps,seats:cap.seats,lf:cap.caps.reduce((n,v)=>n+v,0)>0?pax/cap.caps.reduce((n,v)=>n+v,0):0,fuel,airport,service,maintenance:cap.aircraftMaintenance,gate,ancillary,market,rivals:rivals.length,hours:cap.hours,legs:cap.legs,scheduled:cap.scheduled,operational:cap.operational};}
function estimateWeek(g){const qs=g.routes.map(r=>({r,...routeStats(g,r)}));const sum=k=>qs.reduce((n,q)=>n+q[k],0);const salaries=g.fleet.reduce((n,p)=>n+(p.readyWeek<=g.week+1?TP[p.type].fixed:0),0);const leases=g.fleet.reduce((n,p)=>n+(p.readyWeek<=g.week+1?p.lease:0),0);const hubCost=g.hubs.reduce((n,h)=>n+(17000+AP[h.id].market*1700)*h.level,0);const admin=18000+g.routes.length*1900;const marketing=g.marketing*10000;const interest=g.debt*DIFFICULTY[g.difficulty].apr/52;const fixed=salaries+leases+hubCost+admin+marketing+interest;const revenue=sum('revenue'),variable=sum('cost'),cost=variable+fixed;const pax=sum('pax'),seats=qs.reduce((n,q)=>n+q.capacity.reduce((a,b)=>a+b,0),0);return {routes:qs,revenue,variable,salaries,leases,hubCost,admin,marketing,interest,fixed,cost,profit:revenue-cost,pax,seats,lf:seats?pax/seats:0,fuel:sum('fuel'),airport:sum('airport')+sum('gate'),service:sum('service'),maintenance:sum('maintenance')};}
function routeErrors(g,r,opening=false){const errors=[];if(!AP[r.a]||!AP[r.b]||r.a===r.b)return ['서로 다른 출발·도착 공항을 선택하세요.'];if(!g.hubs.some(h=>h.id===r.a))errors.push('출발지는 보유한 허브여야 합니다.');if(distance(r.a,r.b)<180)errors.push('180km 미만 노선은 개설할 수 없습니다.');if(g.routes.some(x=>x.id!==r.id&&pairKey(x.a,x.b)===pairKey(r.a,r.b)))errors.push('이미 있는 노선입니다. 기존 노선에 항공편을 추가하세요.');if(!r.assignments.length)errors.push('항공기를 최소 1대 배정하세요.');const seen=new Set();for(const x of r.assignments){const p=g.fleet.find(p=>p.id===x.plane);if(!p){errors.push('유효한 항공기를 선택하세요.');continue;}if(seen.has(p.id))errors.push('같은 항공기는 한 번만 배정하세요.');seen.add(p.id);if(p.base!==r.a)errors.push(`${p.registration}: 출발 허브와 항공기 기지가 다릅니다.`);if(distance(r.a,r.b)>TP[p.type].range)errors.push(`${p.registration}: 항속거리가 부족합니다.`);if(!Number.isInteger(x.freq)||x.freq<1||x.freq>56)errors.push('주간 왕복 횟수는 1~56의 정수여야 합니다.');if(r.active&&usedHours(g,p.id,r.id)+tripHours(p.type,r.a,r.b)*x.freq>126.001)errors.push(`${p.registration}: 주 126시간을 초과합니다.`);}if(r.active&&hubUsed(g,r.a,r.id)+r.assignments.reduce((n,x)=>n+x.freq,0)>hubSlots(g,r.a))errors.push('출발 허브의 주간 슬롯이 부족합니다. 허브를 확장하세요.');for(const p of r.prices)if(!Number.isFinite(p)||p<10||p>25000)errors.push('운임은 $10~$25,000 사이여야 합니다.');if(!Number.isInteger(r.service)||r.service<0||r.service>3)errors.push('서비스 설정이 잘못되었습니다.');if(opening&&g.cash<routeOpeningCost(r.a,r.b))errors.push('노선 개설 비용이 부족합니다.');return [...new Set(errors)];}
function suggestPrices(g,r){const copy=clone(r),base=fares(r.a,r.b),caps=routeCapacity(g,r).caps;for(let k=0;k<3;k++){if(!caps[k])continue;let best=-Infinity,price=base[k];for(let f=.55;f<=1.851;f+=.025){copy.prices[k]=Math.round(base[k]*f);const q=routeStats(g,copy);if(q.profit>best){best=q.profit;price=copy.prices[k];}}copy.prices[k]=price;}return copy.prices;}
function logNews(g,text,type='info'){g.news.unshift({week:g.week,text,type});g.news=g.news.slice(0,70);}
function createAI(g){const defs=[['meridian','Meridian Air','#d8b487',68],['bluejet','BlueJet','#7cafff',56],['aurora','Aurora Pacific','#c2a1ed',75]];return defs.map(([id,name,color,reputation],ix)=>{const c={id,name,color,reputation,cash:26000000+ix*12000000,routes:[],totalPax:0,lastProfit:0};const h=g.hubs[0].id;const destinations=AIRPORTS.filter(a=>a.id!==h&&distance(h,a.id)>250&&distance(h,a.id)<(ix===2?11500:6200)).sort((a,b)=>(hash(id+a.id)%100)-(hash(id+b.id)%100)).slice(0,4+ix);for(const a of destinations){const wide=distance(h,a.id)>6500;c.routes.push({a:h,b:a.id,freq:wide?5:7+ix*2,seats:wide?[264,24,4]:[164,8,0],prices:fares(h,a.id).map(v=>Math.round(v*(.83+ix*.13))),service:ix===0?1:ix===1?0:2});}return c;});}
function newGame(name='하늘항공',hub='ICN',difficulty='normal',seed=Date.now()){if(!AP[hub])hub='ICN';if(!DIFFICULTY[difficulty])difficulty='normal';const g={version:1,name:String(name).trim().slice(0,24)||'하늘항공',difficulty,week:0,cash:DIFFICULTY[difficulty].cash,debt:0,reputation:62,totalPax:0,totalProfit:0,rng:(seed>>>0)||1234,nextId:1,fuel:.85,fleet:[],routes:[],hubs:[{id:hub,level:1,primary:true,cost:0}],ai:[],history:[],news:[],events:[],upgrades:{fuel:0,service:0,network:0},marketing:1,autoMaintenance:true,achievements:[],longFlight:false,negativeWeeks:0,over:false,last:null,transactions:[],started:true};g.fleet.push(makePlane(g,'a320',hub,'owned',97,0));g.ai=createAI(g);logNews(g,`${g.name}, ${AP[hub].name}에서 첫 비행을 준비합니다.`,'good');g.history.push({week:0,cash:g.cash,equity:equity(g),profit:0,revenue:0,pax:0,lf:0});return g;}
function recordTransaction(g,text,amount){g.transactions.unshift({week:g.week,text,amount});g.transactions=g.transactions.slice(0,60);}
function addRoute(g,r){const errors=routeErrors(g,r,true);if(errors.length)throw Error(errors[0]);const cost=routeOpeningCost(r.a,r.b);g.cash-=cost;const copy=clone(r);copy.id='r'+g.nextId++;g.routes.push(copy);recordTransaction(g,`${r.a}–${r.b} 노선 개설`,-cost);logNews(g,`${r.a}–${r.b} 신규 취항. 주 ${r.assignments.reduce((n,x)=>n+x.freq,0)}회 왕복.`,'good');return copy;}
function updateRoute(g,r){const errors=routeErrors(g,r,false);if(errors.length)throw Error(errors[0]);const i=g.routes.findIndex(x=>x.id===r.id);if(i<0)throw Error('노선을 찾을 수 없습니다.');g.routes[i]=clone(r);}
function buyPlane(g,type,kind,base){const t=TP[type];if(!t||!['owned','used','lease'].includes(kind)||!g.hubs.some(h=>h.id===base))throw Error('주문 정보를 확인하세요.');const price=Math.round(kind==='lease'?t.price*.07:kind==='used'?t.price*.68:t.price);if(g.cash<price)throw Error('현금이 부족합니다.');if(g.fleet.length>=150)throw Error('이 버전은 최대 150대까지 운영할 수 있습니다.');const p=makePlane(g,type,base,kind,kind==='used'?76:99,kind==='used'?g.week+1:g.week+2,price);g.cash-=price;g.fleet.push(p);recordTransaction(g,`${t.name} ${kind==='lease'?'리스 계약':kind==='used'?'중고 구매':'신규 구매'}`,-price);logNews(g,`${t.name} 계약 완료. ${kind==='used'?'다음 운항부터 투입 가능':'한 주 대기 후 투입 가능'}.`,'good');return p;}
function maintain(g,pid){const p=g.fleet.find(x=>x.id===pid);if(!p||p.readyWeek>g.week+1||p.maintenanceUntil>g.week+1)throw Error('현재 정비할 수 없는 항공기입니다.');const cost=maintenanceCost(p);if(g.cash<cost)throw Error('정비 비용이 부족합니다.');g.cash-=cost;p.condition=100;p.maintenanceUntil=g.week+2;recordTransaction(g,`${p.registration} 중정비`,-cost);return cost;}
function sellPlane(g,pid){const p=g.fleet.find(x=>x.id===pid);if(!p)throw Error('항공기가 없습니다.');if(p.readyWeek>g.week)throw Error('인도 전 계약은 매각·반납할 수 없습니다.');let amount=planeValue(p);if(p.kind==='lease')amount=p.deposit-Math.max(0,12-(g.week-p.acquired))*p.lease;if(g.cash+amount<0)throw Error('중도 해지 비용이 부족합니다.');g.cash+=amount;g.fleet=g.fleet.filter(x=>x.id!==pid);for(const r of g.routes){r.assignments=r.assignments.filter(x=>x.plane!==pid);if(!r.assignments.length)r.active=false;}recordTransaction(g,`${p.registration} ${p.kind==='lease'?'리스 반납':'매각'}`,amount);return amount;}
function changeSeats(g,pid,seats){const p=g.fleet.find(x=>x.id===pid);if(!p||seats.length!==3||seats.some(x=>!Number.isInteger(x)||x<0)||seats[0]+seats[1]*2+seats[2]*4>TP[p.type].seats||seats.reduce((n,v)=>n+v,0)<10)throw Error('좌석 구성을 확인하세요.');if(p.readyWeek>g.week+1||p.maintenanceUntil>g.week+1)throw Error('인도·정비가 끝난 뒤 변경하세요.');const cost=TP[p.type].seats*450;if(g.cash<cost)throw Error('현금이 부족합니다.');g.cash-=cost;p.seats=seats;p.maintenanceUntil=g.week+2;recordTransaction(g,`${p.registration} 객실 개조`,-cost);}
function movePlane(g,pid,base){const p=g.fleet.find(x=>x.id===pid);if(!p||!g.hubs.some(h=>h.id===base)||p.base===base)throw Error('새 기지를 선택하세요.');if(p.readyWeek>g.week+1||p.maintenanceUntil>g.week+1)throw Error('인도·정비가 끝난 뒤 이동하세요.');const cost=120000+distance(p.base,base)*12;if(g.cash<cost)throw Error('현금이 부족합니다.');for(const r of g.routes){r.assignments=r.assignments.filter(x=>x.plane!==pid);if(!r.assignments.length)r.active=false;}g.cash-=cost;p.base=base;p.maintenanceUntil=g.week+2;recordTransaction(g,`${p.registration} ${base} 기지 이동`,-cost);}

function render(){if(!G)return;const tabChanged=lastRenderedTab!==UI.tab;lastRenderedTab=UI.tab;const focusedMap=UI.selectedAirport;const app=$('#app');app.innerHTML=`<aside class="sidebar"><div class="brand"><div class="brandmark">${icon('plane')}</div><div class="brandtext"><div class="brandtitle">SKYWARD</div><small>AIRLINE TYCOON</small></div></div><div class="navlabel">OPERATIONS</div>${navHTML()}<div class="sidebottom"><div class="pill green"><span class="dot"></span> LOCAL SIMULATION</div><p class="muted mt">당신의 결정으로<br>세계의 하늘을 연결하세요.</p><div class="row mt">${btn(icon('help'),'help','aria-label="게임 도움말"','iconbtn ghost')}${btn(icon('settings'),'settings','aria-label="설정"','iconbtn ghost')}</div><div class="edition">SKYWARD / EDITION 01</div></div></aside><div class="mainwrap">${headerHTML()}<main id="main">${G.cash<0&&!G.over?`<div class="notice red cashrisk">현금이 부족합니다. 4주 연속 적자 잔고 또는 현금 −$5M 미만이면 운영이 종료됩니다. 현재 ${G.negativeWeeks}주 연속 현금 부족입니다.</div>`:''}${G.over?`<div class="notice red cashrisk"><b>항공사 운영 종료</b> · 지급불능 상태입니다. 재무 내역은 계속 확인할 수 있습니다. ${btn('새 항공사','newgame','','small danger')}</div>`:''}${({network:renderNetwork,routes:renderRoutes,fleet:renderFleet,finance:renderFinance,company:renderCompany}[UI.tab]||renderNetwork)()}</main></div>${navHTML(true)}`;UI.selectedAirport=focusedMap;if(UI.tab==='network'){initMap();refreshAirportBar();}if(tabChanged)window.scrollTo(0,0);}
function title(eyebrow,name,sub='',actions=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1 style="margin-top:7px">${name}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</div>${actions?`<div class="headbuttons">${actions}</div>`:''}</div>`;}
function stat(label,value,foot,ic='chart',color=''){return `<div class="card stat"><div class="statlabel">${label}${icon(ic)}</div><div class="statvalue ${color}">${value}</div><div class="statfoot">${foot}</div></div>`;}
function spark(values,color='#71e8c2',height=115,area=true){if(values.length<2)values=[0,...values,values[0]||0];const min=Math.min(...values,0),max=Math.max(...values,1),range=max-min||1,w=500,pad=8;const y=v=>height-pad-(v-min)/range*(height-pad*2);const pts=values.map((v,i)=>[pad+i/(values.length-1)*(w-pad*2),y(v)]);const path=pts.map((p,i)=>(i?'L':'M')+p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="주간 추이 그래프"><line x1="0" y1="${y(0)}" x2="500" y2="${y(0)}" stroke="#344250" stroke-dasharray="4 5"/>${area?`<path d="${path} L${w-pad},${height} L${pad},${height}Z" fill="${color}" opacity=".07"/>`:''}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3.8" fill="${color}"/></svg>`;}
function renderNetwork(){const q=estimateWeek(G),nextAch=ACHIEVEMENTS.find(a=>!G.achievements.includes(a.id)),recent=G.history.slice(-20),best=q.routes.filter(r=>r.r.active).sort((a,b)=>b.profit-a.profit).slice(0,3);return `${title('YOUR WORLD, CONNECTED','세계로 향하는 다음 비행','노선을 만들고, 수익을 키우고, 당신의 항공사를 성장시키세요.',btn(icon('plus')+' 노선 개설','route-new','','primary'))}<div class="grid4 mb">${stat('다음 주 예상 순이익',money(q.profit),'리스 · 인건비 · 이자까지 차감','chart',cls(q.profit))}${stat('주간 예상 수송객',num(q.pax)+'<span style="font-size:12px;margin-left:4px">명</span>','예상 탑승률 '+pct(q.lf),'users')}${stat('운항 네트워크',G.routes.filter(r=>r.active).length+'<span style="font-size:12px;margin-left:5px">노선</span>',G.hubs.length+'개 허브 · 기단 '+G.fleet.length+'대','routes')}${stat('항공사 평판',num(G.reputation,0)+'<span style="font-size:12px;color:var(--muted)"> / 100</span>','누적 수송객 '+num(G.totalPax)+'명','star')}</div><div class="maincols"><div class="stack"><section class="card mapcard"><div class="maptop"><div><h3>글로벌 네트워크</h3><span class="maplabel">${AIRPORTS.length} AIRPORTS · PAN & ZOOM</span></div>${btn(icon('search')+' 공항 찾기','airport-search','','small ghost')}</div><div class="mapwrap"><canvas id="worldMap" aria-label="공항과 항공 노선 지도. 드래그로 이동, 두 손가락으로 확대. 공항 찾기 버튼으로도 모든 공항에 접근할 수 있습니다."></canvas><div class="mapcontrols">${btn(icon('plus'),'map-zoom','data-factor="1.4" aria-label="지도 확대"','iconbtn')}${btn(icon('minus'),'map-zoom','data-factor="0.72" aria-label="지도 축소"','iconbtn')}${btn(icon('focus'),'map-home','aria-label="허브 중심으로 이동"','iconbtn')}</div><div class="maphint">드래그 이동 · 두 손가락 확대 · 공항 터치</div></div><div id="airportBar"></div><div class="maplegend"><div class="legendbit positive"><span class="dot"></span> 우리 항공사</div><div class="legendbit amber"><span class="dot"></span> ${G.hubs.length} HUBS</div><button data-action="rivals-toggle" class="ghost" style="min-height:24px;padding:0 2px;font-size:10px;color:var(--muted)">${UI.showRivals?'◉':'○'} 경쟁 노선</button><span>Natural Earth</span></div></section><div class="grid2"><div class="card"><div class="cardhead"><h3>순이익 추이</h3><span class="pill">최근 ${Math.min(20,G.history.length)}주</span></div><strong class="mono ${cls(G.last?.profit||0)}" style="font-size:25px">${money(G.last?.profit||0)}</strong><span class="muted" style="font-size:10px;margin-left:8px">지난주 순이익</span><div class="chartwrap">${spark(recent.map(h=>h.profit),'#71e8c2',115)}</div><div class="chartlabels"><span>${recent[0]?.week||0}주</span><span>${G.week}주</span></div></div><div class="card"><div class="cardhead"><h3>수익 상위 노선</h3>${btn(icon('arrow'),'tab','data-tab="routes" aria-label="노선 관리 열기"','iconbtn ghost')}</div>${best.length?best.map(r=>`<div class="minirow"><div><strong>${r.r.a} <span class="muted">→</span> ${r.r.b}</strong><div class="muted" style="font-size:10px">탑승률 ${pct(r.lf)}</div></div><strong class="${cls(r.profit)} mono">${money(r.profit)}</strong></div>`).join(''):`<p class="note">첫 노선을 개설하면 주간 예상 기여이익을 확인할 수 있습니다.</p>`}</div></div></div><aside class="stack networkaside">${G.routes.length===0?`<div class="callout"><div class="eyebrow">FIRST FLIGHT</div><h3 style="margin-top:8px">첫 노선을 개설하세요</h3><p>A320neo 한 대가 준비되어 있습니다. 가까운 도시부터 연결하고, 남은 운항시간을 활용해 노선을 늘려보세요.</p>${btn('추천 노선으로 시작 '+icon('next'),'first-route','','primary')}</div>`:`<div class="card"><div class="cardhead"><h3>운항 브리핑</h3>${pill('NEXT WEEK','green')}</div><div class="minirow"><span class="muted">항공유 / kg</span><b class="mono">${money(G.fuel,true)}</b></div><div class="minirow"><span class="muted">예상 연료비</span><b class="mono">${money(q.fuel)}</b></div><div class="minirow"><span class="muted">정비·인도 대기</span><b>${G.fleet.filter(p=>!isAvailable(p,G.week+1)).length}대</b></div><div class="minirow"><span class="muted">순자산</span><b>${money(equity(G))}</b></div>${G.events.length?`<div class="notice mt">${G.events.map(e=>`${esc(e.name)} <small>(${e.until-G.week}주)</small>`).join('<br>')}</div>`:''}</div>`}<div class="card"><div class="cardhead"><h3>다음 목표</h3>${icon('trophy')}</div><h3 class="positive">${nextAch?nextAch.title:'하늘의 제국 완성'}</h3><p class="note mt">${nextAch?nextAch.desc:'모든 목표를 달성했습니다. 경영은 계속됩니다.'}</p><div class="row between mt"><span class="pill green">${nextAch?'보상 '+money(nextAch.reward):'ALL CLEAR'}</span><span class="note">${G.achievements.length} / ${ACHIEVEMENTS.length}</span></div><div class="progress mt"><i style="width:${G.achievements.length/ACHIEVEMENTS.length*100}%"></i></div></div><div class="card newsbox"><div class="cardhead"><h3>항공 뉴스</h3><span class="skychip">LIVE BRIEF</span></div>${G.news.slice(0,4).map(n=>`<div class="newsitem"><span class="newsmark" style="background:${n.type==='warn'?'var(--amber)':'var(--mint)'}"></span><div>${esc(n.text)}<div class="newsdate">${gameDate(n.week)}</div></div></div>`).join('')}</div></aside></div>`;}
function routeCard(r){const q=routeStats(G,r),total=r.assignments.reduce((n,x)=>n+x.freq,0);return `<article class="card routecard"><div class="routehead"><div><div class="iata">${r.a}</div><div class="routecity">${AP[r.a].name}</div></div><div class="routearrow">${icon('plane')}</div><div><div class="iata">${r.b}</div><div class="routecity">${AP[r.b].name}</div></div><div class="routeprofit"><strong class="mono ${cls(q.profit)}">${money(q.profit)}</strong><small class="muted">주간 기여이익</small></div></div><div class="routefacts"><div><small>거리</small>${num(distance(r.a,r.b))} km</div><div><small>주간 왕복</small>${total}회 · ${r.assignments.length}대</div><div><small>Y / J / F 운임</small><span style="font-size:10px">${r.prices.map(p=>'$'+num(p)).join(' / ')}</span></div></div><div class="row between" style="font-size:11px;margin-bottom:7px"><span class="muted">예상 탑승률</span><strong>${pct(q.lf)}</strong></div><div class="progress ${q.lf<.6?'warn':''}"><i style="width:${q.lf*100}%"></i></div><div class="routefoot"><div class="row" style="gap:5px">${pill(r.active?'운항':'휴항',r.active?'green':'orange')}${q.rivals?pill('경쟁 '+q.rivals):pill('단독 취항')}${q.scheduled&&!q.operational&&r.active?pill('기재 대기','orange'):''}</div>${btn('운임 · 배정 '+icon('edit'),'route-edit',`data-id="${r.id}"`,'small')}</div></article>`;}
function renderRoutes(){const q=estimateWeek(G);return `${title('ROUTE MANAGEMENT','노선 관리','가격만 낮추기보다, 수요에 맞는 좌석과 운항 횟수를 찾으세요.',btn(icon('plus')+' 새 노선','route-new','','primary'))}<div class="summarybanner"><div><strong>모든 노선의 주간 기여이익</strong><p>기여이익은 운항 변동비 차감 후 금액입니다. 회사 고정비는 재무에서 확인하세요.</p></div><div class="summarynumber mono ${cls(q.revenue-q.variable)}">${money(q.revenue-q.variable)}</div></div><div class="filterbar"><input id="routeSearch" aria-label="노선 검색" placeholder="도시 또는 공항 코드 검색" value="${esc(UI.routeSearch)}"><select id="routeFilter" aria-label="노선 필터"><option value="all" ${UI.routeFilter==='all'?'selected':''}>모든 노선</option><option value="loss" ${UI.routeFilter==='loss'?'selected':''}>적자 노선</option><option value="low" ${UI.routeFilter==='low'?'selected':''}>탑승률 70% 미만</option><option value="paused" ${UI.routeFilter==='paused'?'selected':''}>휴항 노선</option></select></div><div id="routeList">${routeListHTML()}</div><div class="notice mt">왕복 1회는 출발편 1회와 복귀편 1회입니다. 항공기별 주간 운항시간은 회항 준비시간을 포함해 126시간까지 배정할 수 있습니다.</div>`;}
function routeListHTML(){const term=UI.routeSearch.trim().toLowerCase();const routes=G.routes.filter(r=>{const q=routeStats(G,r);return (!term||[r.a,r.b,AP[r.a].name,AP[r.b].name].some(s=>s.toLowerCase().includes(term)))&&(UI.routeFilter==='all'||UI.routeFilter==='loss'&&q.profit<0||UI.routeFilter==='low'&&q.lf<.7||UI.routeFilter==='paused'&&!r.active);});return routes.length?`<div class="routegrid">${routes.map(routeCard).join('')}</div>`:`<div class="card empty">${icon('routes')}<h3>${G.routes.length?'검색 결과가 없습니다':'아직 연결된 노선이 없습니다'}</h3><p>공항을 선택하고 항공기를 배정하면 취항 준비가 끝납니다.</p>${btn('첫 노선 개설하기','route-new','','primary')}</div>`;}
function planeArt(type,id=''){const t=TP[type];return `<svg viewBox="0 0 440 150" fill="none" aria-hidden="true"><defs><linearGradient id="body${type}${id}" x1="0" y1="50" x2="0" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#e7f3f2"/><stop offset=".48" stop-color="#b9cbd0"/><stop offset="1" stop-color="#667f8e"/></linearGradient></defs><path d="M176 77 243 31 258 33 224 81" fill="#748c9c"/><path d="M44 79 19 34 37 30 97 78" fill="#70d6b7"/><path d="M30 80Q200 69 342 76Q366 77 389 90L413 99Q418 103 407 107Q343 116 74 109L24 98Q11 88 30 80Z" fill="url(#body${type}${id})"/><path d="M33 99Q190 108 409 100L411 106Q225 121 74 109Z" fill="#648a91" opacity=".55"/><path d="m172 99 77 45 31-1-54-50Z" fill="#b9ccd3"/><path d="m36 96 47 28 20-1-26-28Z" fill="#7897a5"/><path d="M357 81l18 6 6 7-27-3Z" fill="#224351"/><path d="m343 81 10 1-3 8-10-1Z" fill="#224351"/><g fill="#294753">${Array.from({length:23},(_,i)=>`<rect x="${104+i*9.5}" y="84" width="4" height="5" rx="1.5"/>`).join('')}</g><path d="M248 108h33q8 0 8 8t-8 9h-33q-6-9 0-17Z" fill="#c0d5d8"/><ellipse cx="249" cy="116.5" rx="5" ry="8" fill="#254a51"/><path d="m29 53 17 14 15 2-28-24Z" fill="#0f4538"/><text x="133" y="102" font-family="sans-serif" font-size="8" font-weight="700" fill="#164c41" letter-spacing="2">SKYWARD</text>${t.id==='atr'?'<path d="M255 100v35m-16-17h32" stroke="#cfdfdf" stroke-width="3"/>':''}</svg>`;}
function fleetCard(p){const t=TP[p.type],h=usedHours(G,p.id),waiting=p.readyWeek>G.week+1,maint=p.maintenanceUntil>G.week+1;return `<article class="card planecard"><div class="planevisual"><span class="planetype">${t.role}</span><span class="planereg">${p.registration}</span>${planeArt(p.type,p.id)}<span class="typebadge">${p.kind==='lease'?'LEASED':p.kind==='used'?'PRE-OWNED':'OWNED'}</span></div><div class="planebody"><div class="row between"><h3>${t.name}</h3>${pill(waiting?'인도 대기':maint?'정비 중':p.condition<=35?'운항 중지':h>0?'운항 배정':'배정 대기',waiting||maint||p.condition<=35?'orange':'green')}</div><div class="planespecs"><div><small>기지</small>${p.base}</div><div><small>좌석 Y / J / F</small>${p.seats.join(' / ')}</div><div><small>항속거리</small>${num(t.range)} km</div></div><div class="row between" style="font-size:11px;margin:12px 0 6px"><span class="muted">주간 배정시간</span><strong>${num(h,1)} / 126 h</strong></div><div class="progress"><i style="width:${h/126*100}%"></i></div><div class="row between" style="font-size:11px;margin:12px 0 6px"><span class="muted">기체 상태</span><strong class="${p.condition<68?'amber':''}">${num(p.condition,0)}%</strong></div><div class="progress ${p.condition<68?'warn':''}"><i style="width:${p.condition}%"></i></div><div class="row between mt" style="font-size:10px;color:var(--muted)"><span>${p.lease?'주간 리스료 '+money(p.lease):'예상 매각가 '+money(planeValue(p))}</span><span>${num(p.totalHours)} h 비행</span></div><div class="planeactions">${btn('기체 관리','plane-detail',`data-id="${p.id}"`)}${btn('노선 배정','route-for-plane',`data-id="${p.id}" ${waiting?'disabled':''}`,'primary')}</div></div></article>`;}
function shopCard(t){return `<article class="card planecard"><div class="planevisual"><span class="planetype">${t.role}</span>${planeArt(t.id)}<span class="typebadge">${t.range>=10000?'LONG HAUL':'REGIONAL'}</span></div><div class="planebody"><h3>${t.name}</h3><div class="planespecs"><div><small>기본 최대좌석</small>${t.seats}석</div><div><small>항속거리</small>${num(t.range)} km</div><div><small>연료 소비</small>${num(t.burn)} kg/h</div></div><div class="row between"><div><small style="font-size:10px">신규 구매</small><div class="planeprice">${money(t.price)}</div></div><div class="right"><small style="font-size:10px">주간 리스료</small><div class="positive" style="font-weight:700">${money(t.lease)}</div></div></div><div class="planeactions">${btn('구매 · 리스 견적','plane-buy',`data-type="${t.id}"`,'primary')}</div></div></article>`;}
function renderFleet(){const total=G.fleet.reduce((n,p)=>n+usedHours(G,p.id),0);return `${title('FLEET OPERATIONS','당신의 항공기','기종에 맞는 노선을 찾는 것이 좋은 경영의 시작입니다.')}<div class="row between mb wrap"><div class="segment">${btn('보유 기단 '+G.fleet.length,'fleet-tab','data-value="owned"',UI.fleetTab==='owned'?'active':'')}${btn('항공기 시장','fleet-tab','data-value="shop"',UI.fleetTab==='shop'?'active':'')}</div><span class="pill">${UI.fleetTab==='owned'?'기단 활용도 '+pct(total/Math.max(1,G.fleet.length*126)):'게임 밸런스용 기종 사양'}</span></div>${UI.fleetTab==='shop'?`<div class="notice mb">신규·리스는 1주 대기 후 운항할 수 있습니다. 중고는 바로 다음 운항에 투입됩니다. 표시된 가격·사양은 실제 판매 조건이 아닌 게임 수치입니다.</div><div class="fleetgrid">${TYPES.map(shopCard).join('')}</div>`:`${G.fleet.length?`<div class="fleetgrid">${G.fleet.map(fleetCard).join('')}</div>`:`<div class="card empty">${icon('fleet')}<h3>항공기가 없습니다</h3><p>시장에 들어가 구매하거나 리스로 운영을 시작하세요.</p>${btn('항공기 시장','fleet-tab','data-value="shop"','primary')}</div>`}<div class="notice mt">기체 상태가 68% 미만이면 자동 정비가 작동합니다(설정에서 변경). 정비·객실 개조·기지 이전 시 다음 한 주 운항이 중단됩니다. 35% 이하는 운항할 수 없습니다.</div>`}`;}
function financialRows(q){return `<div class="minirow"><strong>총매출</strong><strong>${money(q.revenue,true)}</strong></div><div class="minirow"><span>연료비</span><span>−${money(q.fuel,true)}</span></div><div class="minirow"><span>공항 이용료 · 게이트</span><span>−${money(q.airport,true)}</span></div><div class="minirow"><span>기내 서비스</span><span>−${money(q.service,true)}</span></div><div class="minirow"><span>운항 정비비</span><span>−${money(q.maintenance,true)}</span></div><div class="minirow"><span>승무원 · 기체 고정비</span><span>−${money(q.salaries,true)}</span></div><div class="minirow"><span>항공기 리스료</span><span>−${money(q.leases,true)}</span></div><div class="minirow"><span>허브 운영비</span><span>−${money(q.hubCost,true)}</span></div><div class="minirow"><span>본사 · 노선 관리비</span><span>−${money(q.admin,true)}</span></div><div class="minirow"><span>마케팅</span><span>−${money(q.marketing,true)}</span></div><div class="minirow"><span>대출 이자</span><span>−${money(q.interest,true)}</span></div><div class="minirow total"><strong>주간 순이익</strong><strong class="${cls(q.profit)}">${money(q.profit,true)}</strong></div>`;}
function renderFinance(){const q=estimateWeek(G),limit=creditLimit(G),hist=G.history.slice(-26);return `${title('FINANCIAL CONTROL','숫자로 보는 항공사','매출보다 현금흐름을, 규모보다 수익성을 먼저 확인하세요.')}<div class="grid4 mb">${stat('보유 현금',money(G.cash),'모든 투자 · 보상 · 결산 반영','wallet',G.cash<0?'negative':'')}${stat('순자산',money(equity(G)),'현금 + 잔존자산 − 부채','chart')}${stat('대출 잔액',money(G.debt),'연 이자 '+num(DIFFICULTY[G.difficulty].apr*100,1)+'%','building')}${stat('누적 영업 순이익',money(G.totalProfit),'구매·개설·목표 보상 별도','chart',cls(G.totalProfit))}</div><div class="grid2"><section class="card ledger"><div class="cardhead"><h3>다음 주 손익 예상</h3>${pill('FORECAST','green')}</div>${financialRows(q)}<p class="note mt">항공기 매입, 노선·허브 개설, 중정비와 목표 보상은 위 손익과 별도로 현금에 반영됩니다. 자동 중정비가 실행되거나 기상·기체 상태·운임이 바뀌면 전망과 실적이 달라질 수 있습니다.</p></section><div class="stack"><section class="card"><div class="cardhead"><h3>현금 잔고 추이</h3><span class="pill">최근 26주</span></div>${spark(hist.map(h=>h.cash),'#81aeff',145)}<div class="chartlabels"><span>${hist[0]?.week||0}주</span><span>${G.week}주</span></div></section><section class="card"><div class="cardhead"><h3>금융 센터</h3>${icon('building')}</div><div class="row between"><span class="muted">추가 대출 가능액</span><strong class="positive">${money(Math.max(0,limit-G.debt))}</strong></div><div class="progress debtbar"><i style="width:${Math.min(100,G.debt/limit*100)}%"></i></div><div class="note mt">대출 한도 ${money(limit)} · 매주 이자 ${money(q.interest)}<br>원금은 자동 상환하지 않습니다. 아래에서 직접 상환하세요.</div><div class="row wrap mt">${[1000000,5000000,10000000].map(v=>btn(money(v)+' 대출','borrow',`data-value="${v}" ${G.debt+v>limit||G.over?'disabled':''}`,'small')).join('')}</div><div class="row wrap mt">${btn('$1M 상환','repay',`data-value="1000000" ${G.cash<1e6||G.debt<1e6||G.over?'disabled':''}`,'small ghost')}${btn('가능한 만큼 상환','repay',`data-value="all" ${G.cash<=0||G.debt<=0||G.over?'disabled':''}`,'small ghost')}</div></section>${G.last?`<section class="card"><div class="cardhead"><h3>지난주 결산</h3><span class="pill">WEEK ${G.last.week}</span></div><div class="minirow"><span>매출 / 순이익</span><strong class="${cls(G.last.profit)}">${money(G.last.revenue)} / ${money(G.last.profit)}</strong></div><div class="minirow"><span>수송객 / 탑승률</span><strong>${num(G.last.pax)} / ${pct(G.last.lf)}</strong></div>${G.last.maintenanceSpending?`<p class="note mt">자동 중정비 지출 ${money(G.last.maintenanceSpending)}는 별도 현금 지출입니다.</p>`:''}</section>`:''}</div></div><div class="sectiontitle"><h3>최근 투자 · 금융 거래</h3><span class="note">주간 운항 손익 외 거래</span></div><div class="card tablewrap" style="padding:0"><table><thead><tr><th>게임 날짜</th><th>내용</th><th class="right">현금 변동</th></tr></thead><tbody>${G.transactions.length?G.transactions.slice(0,15).map(t=>`<tr><td>${gameDate(t.week)}</td><td>${esc(t.text)}</td><td class="right mono ${cls(t.amount)}">${t.amount>0?'+':''}${money(t.amount,true)}</td></tr>`).join(''):'<tr><td colspan="3" class="muted">아직 거래가 없습니다.</td></tr>'}</tbody></table></div>`;}
function renderCompany(){const ranking=[{id:'you',name:G.name,value:equity(G),routes:G.routes.filter(r=>r.active).length,pax:G.totalPax,rep:G.reputation,color:'#71e8c2'},...G.ai.map(c=>({id:c.id,name:c.name,value:c.cash+c.routes.length*3500000,routes:c.routes.length,pax:c.totalPax,rep:c.reputation,color:c.color}))].sort((a,b)=>b.value-a.value);return `${title('AIRLINE HEADQUARTERS','항공사 경영','브랜드와 허브에 투자하고, 경쟁사를 넘어설 전략을 세우세요.',btn(icon('settings'),'settings','aria-label="저장 및 설정"','iconbtn'))}<div class="grid2"><div class="card"><div class="cardhead"><h3>운영 정책</h3>${pill('주간 적용','green')}</div><label for="marketing">주간 마케팅 예산</label><div class="row between mb"><strong class="policybig" id="marketingLabel">${money(G.marketing*10000)}</strong><span class="note">인지도·목표 평판 개선</span></div><input id="marketing" type="range" min="0" max="10" step="1" value="${G.marketing}" aria-label="주간 마케팅 예산"><div class="chartlabels"><span>$0</span><span>$100K / 주</span></div><div class="settingrow"><div><label for="autoMaintenance">자동 중정비</label><p>상태 68% 미만일 때 정비. 현금 여유 $200K 필요.</p></div><input type="checkbox" id="autoMaintenance" ${G.autoMaintenance?'checked':''}></div><div class="settingrow"><div><label>항공사 이름</label><p>${esc(G.name)}</p></div>${btn('변경','rename','','small ghost')}</div></div><div class="card"><div class="cardhead"><h3>허브 네트워크</h3>${btn(icon('plus')+' 허브','hub-new','','small')}</div>${G.hubs.map(h=>`<div style="margin-bottom:16px"><div class="row between"><div><strong>${h.id} · ${AP[h.id].name}</strong><span class="note" style="margin-left:7px">LV.${h.level}</span></div>${btn('확장','hub-expand',`data-id="${h.id}" ${h.level>=5?'disabled':''}`,'small ghost')}</div><div class="row between" style="font-size:10px;color:var(--muted);margin:7px 0"><span>주간 왕복 슬롯</span><span>${hubUsed(G,h.id)} / ${hubSlots(G,h.id)}</span></div><div class="progress"><i style="width:${hubUsed(G,h.id)/hubSlots(G,h.id)*100}%"></i></div></div>`).join('')}<p class="note">새 허브를 개설한 뒤 항공기를 구매하거나 기지를 이전해야 그곳에서 출발할 수 있습니다.</p></div></div><div class="sectiontitle"><h3>성장을 위한 투자</h3><span class="note">각 프로그램 최대 5단계</span></div><div class="grid3">${UPGRADE_DEFS.map(u=>`<div class="upgrade"><div class="row between"><span class="positive">${icon(u.icon)}</span>${pill('LV.'+G.upgrades[u.id]+' / '+u.max)}</div><h3>${u.name}</h3><p class="note">${u.desc}</p>${btn(G.upgrades[u.id]>=u.max?'최대 단계':money(Math.round(u.base*1.8**G.upgrades[u.id]))+' 투자','upgrade',`data-id="${u.id}" ${G.upgrades[u.id]>=u.max||G.cash<u.base*1.8**G.upgrades[u.id]||G.over?'disabled':''}`)}</div>`).join('')}</div><div class="sectiontitle"><h3>항공사 경쟁 순위</h3><span class="note">AI 경쟁 · 추정 순자산 기준</span></div><div class="card tablewrap" style="padding:0"><table><thead><tr><th>순위</th><th>항공사</th><th>평가액</th><th>운항 노선</th><th>누적 수송객</th><th>평판</th></tr></thead><tbody>${ranking.map((r,i)=>`<tr class="${r.id==='you'?'me':''}"><td class="ranknum">${i+1}</td><td><span class="dot" style="color:${r.color};margin-right:8px"></span><strong>${esc(r.name)}</strong>${r.id==='you'?' <small>YOU</small>':''}</td><td>${money(r.value)}</td><td>${r.routes}</td><td>${num(r.pax)}</td><td>${num(r.rep)}</td></tr>`).join('')}</tbody></table></div><div class="sectiontitle"><h3>경영 목표</h3><span class="note">${G.achievements.length} / ${ACHIEVEMENTS.length} 달성</span></div><div class="grid2">${ACHIEVEMENTS.map(a=>`<div class="card achievement ${G.achievements.includes(a.id)?'done':''}"><div class="achievementmark">${icon(G.achievements.includes(a.id)?'check':'trophy')}</div><div class="grow"><h4>${a.title}</h4><p>${a.desc}</p></div><span class="pill ${G.achievements.includes(a.id)?'green':''}">${G.achievements.includes(a.id)?'달성':money(a.reward)}</span></div>`).join('')}</div>`;}
let confirmCallback=null,bodyScroll=0;
function lockBody(){if(!document.body.dataset.locked){bodyScroll=window.scrollY;document.body.dataset.locked='1';document.body.style.position='fixed';document.body.style.top=(-bodyScroll)+'px';document.body.style.width='100%';}document.body.style.overflow='hidden';}
function unlockBody(){delete document.body.dataset.locked;document.body.style.position='';document.body.style.top='';document.body.style.width='';document.body.style.overflow='';window.scrollTo(0,bodyScroll);}

function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;const top=$('.topbar');if(top&&G)top.outerHTML=headerHTML();}}
function setModal(titleText,body,footer='',kind='generic',wide=false){stopAuto();if(!modalKind)lastFocused=document.activeElement;modalKind=kind;$('#modalRoot').innerHTML=`<div class="modalback"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${titleText}</h2>${btn(icon('close'),'modal-close','aria-label="닫기"','iconbtn ghost')}</div><div class="modalbody">${body}</div>${footer?`<div class="modalfooter">${footer}</div>`:''}</section></div>`;lockBody();setTimeout(()=>{const b=$('#modalRoot [data-action="modal-close"]');if(b)b.focus({preventScroll:true});},25);}
function closeModal(force=false){if(modalKind==='welcome'&&!force)return;$('#modalRoot').innerHTML='';unlockBody();modalKind='';UI.editor=null;confirmCallback=null;if(lastFocused&&document.contains(lastFocused))lastFocused.focus({preventScroll:true});}
function confirmDialog(titleText,body,callback,buttonText='확인',danger=false){setModal(titleText,body,btn('취소','modal-close','','ghost')+btn(buttonText,'confirm','',''+(danger?'danger':'primary')),'confirm');confirmCallback=callback;}
function openWelcome(){stopAuto();modalKind='welcome';UI.onboarding=true;$('#modalRoot').innerHTML=`<div class="modalback"><section class="modal onboarding" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><div class="welcomeart"><div class="brand"><div class="brandmark">${icon('plane')}</div><div class="brandtext"><div class="brandtitle">SKYWARD</div><small>AIRLINE TYCOON</small></div></div><div class="welcomeplane">${icon('plane')}</div></div><div class="modalbody"><div class="eyebrow">YOUR AIRLINE. YOUR WORLD.</div><h1 class="welcomeheadline" id="welcomeTitle">한 대의 항공기로 시작하는<br><span>당신만의 항공 제국.</span></h1><p class="note">노선을 개설하고 운임을 설계하세요. 세계 ${AIRPORTS.length}개 공항과 3개 AI 항공사가 당신의 결정을 기다립니다.</p><div class="welcomechips"><span>터치 조작</span><span>기기 내 자동 저장</span><span>서버 · 계정 불필요</span><span>싱글 플레이</span></div><div class="formgrid"><div class="field full"><label for="airlineName">항공사 이름</label><input id="airlineName" maxlength="24" autocomplete="off" value="하늘항공" placeholder="항공사 이름"></div><div class="field"><label for="startHub">시작 허브</label><select id="startHub">${['ICN','GMP','PUS','HND','SIN','DXB','LHR','JFK','LAX','SYD'].map(id=>`<option value="${id}">${id} · ${AP[id].name}</option>`).join('')}</select></div><div class="field"><label for="difficulty">경영 난이도</label><select id="difficulty"><option value="easy">여유롭게</option><option value="normal" selected>경영자</option><option value="hard">치열하게</option></select></div></div><div class="notice green mt" id="startCapital">시작 현금 $15M + A320neo 1대 · 부채 없음</div><div class="welcomefoot">${btn('항공사 설립하기 '+icon('next'),'start','','primary')}${btn(icon('upload'),'import','aria-label="저장 파일 불러오기" title="저장 파일 불러오기"','iconbtn ghost')}</div><p class="note" style="font-size:9px;margin-top:12px">가상 수요·가격·기종 성능을 사용하는 독립 경영 시뮬레이션입니다. 화면을 닫으면 시간은 흐르지 않습니다.</p></div></section></div>`;lockBody();}
function recommendedDestination(a){const defaults={ICN:'NRT',GMP:'CJU',PUS:'KIX',HND:'ICN',SIN:'BKK',DXB:'BOM',LHR:'FRA',JFK:'ORD',LAX:'SFO',SYD:'MEL'};const existing=new Set(G.routes.filter(r=>r.a===a).map(r=>r.b));if(defaults[a]&&!existing.has(defaults[a]))return defaults[a];return AIRPORTS.filter(x=>x.id!==a&&!existing.has(x.id)&&distance(a,x.id)>300&&distance(a,x.id)<3500).sort((x,y)=>y.market-x.market)[0]?.id||'ICN';}
function choosePlane(a,b,exclude=null){return G.fleet.filter(p=>p.base===a&&distance(a,b)<=TP[p.type].range&&isAvailable(p,G.week+1)&&126-usedHours(G,p.id,exclude)>=tripHours(p.type,a,b)).sort((p,q)=>(126-usedHours(G,q.id,exclude))-(126-usedHours(G,p.id,exclude)))[0];}
function defaultAssignment(p,a,b,exclude=null){return {plane:p.id,freq:Math.max(1,Math.min(14,Math.floor((126-usedHours(G,p.id,exclude))/tripHours(p.type,a,b))))};}
function openRoute(id=null,target=null,pid=null){const orig=id?G.routes.find(r=>r.id===id):null;const p=pid?G.fleet.find(p=>p.id===pid):null;const a=p?.base||UI.selectedHub||G.hubs[0].id;const b=target&&target!==a?target:recommendedDestination(a);const selected=p||choosePlane(a,b);UI.editor=orig?clone(orig):{id:'new',a,b,assignments:selected?[defaultAssignment(selected,a,b)]:[],prices:fares(a,b),service:1,active:true};renderRouteModal();}
function airportOptions(a,selected,term=''){const airports=AIRPORTS.filter(x=>x.id!==a&&distance(a,x.id)>=180&&(!term||[x.id,x.name,x.country].some(s=>s.toLowerCase().includes(term.toLowerCase())))).sort((x,y)=>distance(a,x.id)-distance(a,y.id));return airports.map(x=>`<option value="${x.id}" ${selected===x.id?'selected':''}>${x.id} · ${x.name} · ${num(distance(a,x.id))} km</option>`).join('');}
function assignmentsHTML(){const r=UI.editor;if(!r)return '';return r.assignments.map((x,i)=>`<div class="assignment"><div><label for="assignPlane${i}">배정 항공기</label><select id="assignPlane${i}" data-assignment="${i}" data-field="plane">${G.fleet.filter(p=>p.base===r.a).map(p=>`<option value="${p.id}" ${p.id===x.plane?'selected':''}>${p.registration} · ${TP[p.type].name} · 여유 ${num(126-usedHours(G,p.id,r.id),0)}h${!isAvailable(p,G.week+1)?' (대기)':''}</option>`).join('')}</select></div><div><label for="assignFreq${i}">주간 왕복</label><input type="number" inputmode="numeric" id="assignFreq${i}" min="1" max="56" step="1" value="${x.freq}" data-assignment="${i}" data-field="freq"></div>${btn(icon('trash'),'assignment-remove',`data-index="${i}" aria-label="항공기 배정 삭제"`,'iconbtn ghost')}</div>`).join('')||'<p class="note mb">이 출발지에 배정 가능한 항공기가 없습니다. 항공기를 구매하거나 기지를 옮겨주세요.</p>';}
function renderRouteModal(){const r=UI.editor;if(!r)return;const isNew=r.id==='new';const body=`<div class="formgrid"><div class="field"><label for="routeFrom">출발 허브</label><select id="routeFrom" ${isNew?'':'disabled'}>${G.hubs.map(h=>`<option value="${h.id}" ${h.id===r.a?'selected':''}>${h.id} · ${AP[h.id].name}</option>`).join('')}</select></div><div class="field"><label for="routeTo">도착 공항</label><select id="routeTo" ${isNew?'':'disabled'}>${airportOptions(r.a,r.b)}</select></div></div><div class="marketcontext mt" id="routeMarket"></div><div class="fieldtitle"><span>항공기와 운항 횟수</span>${btn(icon('plus')+' 항공기 추가','assignment-add','','small ghost')}</div><div id="assignmentList">${assignmentsHTML()}</div><div class="fieldtitle"><span>좌석 등급별 편도 운임 · USD</span>${btn('수익 기준 추천','fare-optimize','','small ghost')}</div><div class="seatgrid">${['일반석 · Y','비즈니스 · J','퍼스트 · F'].map((name,k)=>`<div class="fareitem"><label for="fare${k}">${name}</label><input id="fare${k}" type="number" min="10" max="25000" step="1" inputmode="numeric" value="${r.prices[k]}" data-fare="${k}"></div>`).join('')}</div><div class="formgrid mt"><div class="field"><label for="routeService">기내 서비스</label><select id="routeService">${SERVICES.map((s,i)=>`<option value="${i}" ${r.service===i?'selected':''}>${s.name} · Y ${money(s.cost,true)}/인</option>`).join('')}</select></div><div class="field"><label for="routeActive">운항 상태</label><select id="routeActive"><option value="yes" ${r.active?'selected':''}>운항</option><option value="no" ${!r.active?'selected':''}>휴항</option></select></div></div><div id="routeForecast"></div><div class="note mt">예상 기여이익에는 해당 노선의 연료·공항·서비스·운항 정비비가 반영됩니다. 항공기 리스료·승무원·본사·이자는 회사 손익에 따로 반영됩니다.</div>`;setModal(isNew?'새로운 노선 개설':`${r.a}–${r.b} 노선 관리`,body,(!isNew?btn('폐선','route-delete',`data-id="${r.id}"`,'danger'):'')+btn('취소','modal-close','','ghost')+btn(isNew?'개설 확정':'변경 저장','route-save','id="routeSave"','primary'),'route',true);refreshRouteForecast();}
function refreshRouteForecast(){const r=UI.editor;if(!r||!$('#routeForecast'))return;const errs=routeErrors(G,r,r.id==='new'),q=routeStats(G,r),base=fares(r.a,r.b),cap=q.capacity;$('#routeMarket').innerHTML=`<span><b>${num(distance(r.a,r.b))} km</b> · 경쟁 ${q.rivals}사</span><span>주간 시장 수요 <b>${num(q.market.reduce((n,v)=>n+v,0))}명</b></span>`;$('#routeForecast').innerHTML=`<div class="forecast"><div class="row between"><h3>다음 주 예상</h3>${pill(r.id==='new'?'개설비 '+money(routeOpeningCost(r.a,r.b)):'운임 조정은 무료','green')}</div><div class="forecastnums"><div><small>노선 기여이익</small><strong class="${cls(q.profit)}">${money(q.profit)}</strong></div><div><small>탑승률</small><strong>${pct(q.lf)}</strong></div><div><small>수송객</small><strong>${num(q.pax)}명</strong></div></div><div class="costline"><small>매출 / 운항 변동비</small><span>${money(q.revenue)} / ${money(q.cost)}</span></div><div class="costline"><small>좌석별 탑승률 Y / J / F</small><span>${cap.map((v,k)=>v?pct(q.load[k]):'—').join(' / ')}</span></div><div class="costline"><small>실효 좌석 수 Y / J / F</small><span>${cap.map(v=>num(Math.floor(v))).join(' / ')}</span></div>${r.assignments.map(x=>{const p=G.fleet.find(p=>p.id===x.plane);return p?`<div class="costline"><small>${p.registration} 총 배정시간</small><span class="${usedHours(G,p.id,r.id)+tripHours(p.type,r.a,r.b)*x.freq>126?'negative':''}">${num(usedHours(G,p.id,r.id)+tripHours(p.type,r.a,r.b)*x.freq,1)} / 126 h</span></div>`:'';}).join('')}${q.scheduled&&!q.operational?'<p class="note amber mt">배정된 기재가 정비·인도 대기 중입니다. 다음 운항 주의 매출은 발생하지 않습니다.</p>':''}${errs.length?`<div class="formerror">${errs.map(e=>'• '+esc(e)).join('<br>')}</div>`:''}</div>`;$('#routeSave').disabled=errs.length>0||G.over;}
function syncEditor(el){const r=UI.editor;if(!r)return;if(el.id==='routeFrom'){r.a=el.value;UI.selectedHub=r.a;r.b=recommendedDestination(r.a);r.prices=fares(r.a,r.b);const p=choosePlane(r.a,r.b);r.assignments=p?[defaultAssignment(p,r.a,r.b)]:[];renderRouteModal();return;}if(el.id==='routeTo'){r.b=el.value;r.prices=fares(r.a,r.b);const p=choosePlane(r.a,r.b);r.assignments=p?[defaultAssignment(p,r.a,r.b)]:[];renderRouteModal();return;}if(el.dataset.assignment!==undefined){const i=Number(el.dataset.assignment);if(r.assignments[i])r.assignments[i][el.dataset.field]=el.dataset.field==='freq'?Number(el.value):el.value;}if(el.dataset.fare!==undefined)r.prices[Number(el.dataset.fare)]=Number(el.value);if(el.id==='routeService')r.service=Number(el.value);if(el.id==='routeActive')r.active=el.value==='yes';refreshRouteForecast();}
function openBuy(type){const t=TP[type];setModal(t.name+' 도입',`<div class="planevisual" style="border-radius:14px;margin-bottom:19px">${planeArt(type,'buy')}</div><div class="formgrid"><div class="field"><label for="buyMethod">계약 방식</label><select id="buyMethod"><option value="lease">리스 · 보증금 + 주간 리스료</option><option value="used">중고 구매 · 즉시 도입</option><option value="owned">신규 구매 · 1주 대기</option></select></div><div class="field"><label for="buyBase">배치할 허브</label><select id="buyBase">${G.hubs.map(h=>`<option value="${h.id}">${h.id} · ${AP[h.id].name}</option>`).join('')}</select></div></div><div id="buyQuote" data-type="${type}"></div>`,btn('취소','modal-close','','ghost')+btn('계약 확정','buy-confirm',`data-type="${type}" id="buyConfirm"`,'primary'),'buy');refreshBuyQuote();}
function refreshBuyQuote(){const root=$('#buyQuote');if(!root)return;const t=TP[root.dataset.type],kind=$('#buyMethod').value;const price=kind==='lease'?Math.round(t.price*.07):kind==='used'?t.price*.68:t.price;const fixed=t.fixed+(kind==='lease'?t.lease:0);root.innerHTML=`<div class="forecast"><div class="row between"><span>지금 필요한 현금</span><strong style="font-size:24px" class="${price>G.cash?'negative':'positive'}">${money(price)}</strong></div><div class="costline mt"><small>다음 주 이후 주간 기체 고정비</small><span>${money(fixed)}</span></div><div class="costline"><small>초기 상태</small><span>${kind==='used'?'76%':'99%'}</span></div><div class="costline"><small>가용 시점</small><span>${kind==='used'?'다음 주 운항부터':'한 주 대기 후 운항'}</span></div><div class="costline"><small>계약 후 보유 현금</small><span>${money(G.cash-price)}</span></div></div><p class="note mt">${kind==='lease'?'보증금은 반납 시 반환됩니다. 계약 후 12주 전에 반납하면 남은 최소 계약기간의 리스료가 공제됩니다. 리스 항공기는 매각할 수 없습니다.':'중고 항공기는 같은 성능이지만 상태·잔존가치가 낮습니다. 매각가는 최초 구매가와 다르며 인도 전 매각은 불가능합니다.'}<br>고정비 외에 실제 운항에 따른 연료비·공항 이용료·정비비 등이 추가됩니다.</p>`;$('#buyConfirm').disabled=price>G.cash||G.over;}
function openPlane(id){const p=G.fleet.find(p=>p.id===id);if(!p)return;const t=TP[p.type],assigned=G.routes.filter(r=>r.assignments.some(a=>a.plane===id));setModal(`${p.registration} · 기체 관리`,`<div class="row between mb"><div><h3>${t.name}</h3><p class="note">${p.base} 기지 · ${num(p.age/52,1)}년 · ${num(p.totalHours)}시간 비행</p></div>${pill(p.kind==='lease'?'리스':'소유','green')}</div><div class="grid2 keep"><div class="card flat"><label>기체 상태</label><strong class="statvalue">${num(p.condition)}%</strong></div><div class="card flat"><label>주간 배정시간</label><strong class="statvalue">${num(usedHours(G,id),1)}h</strong></div></div><div class="sectiontitle"><h3>정비와 객실</h3></div><div class="settingrow"><div><label>중정비</label><p>상태 100% 복원 · 다음 한 주 운항 중단</p></div>${btn(money(maintenanceCost(p))+' 정비','plane-maintain',`data-id="${id}" ${p.condition>=99||p.readyWeek>G.week+1||p.maintenanceUntil>G.week+1||G.cash<maintenanceCost(p)||G.over?'disabled':''}`,'small')}</div><div class="settingrow"><div><label>객실 구성</label><p>Y ${p.seats[0]} / J ${p.seats[1]} / F ${p.seats[2]} · 개조비 ${money(t.seats*450)}</p></div>${btn('변경','plane-seats',`data-id="${id}" ${!isAvailable(p,G.week+1)||G.over?'disabled':''}`,'small')}</div><div class="settingrow"><div><label>기지 이전</label><p>배정 해제 후 새 허브로 이동 · 한 주 중단</p></div>${btn('이전','plane-move',`data-id="${id}" ${G.hubs.length<2||!isAvailable(p,G.week+1)||G.over?'disabled':''}`,'small')}</div><div class="sectiontitle"><h3>배정 노선</h3></div>${assigned.length?assigned.map(r=>`<div class="minirow"><span>${r.a}–${r.b}</span><span>주 ${r.assignments.find(a=>a.plane===id).freq}회 왕복 ${r.active?'':'(휴항)'}</span></div>`).join(''):'<p class="note">아직 배정된 노선이 없습니다.</p>'}<div class="divider"></div><p class="note">${p.kind==='lease'?'보증금 '+money(p.deposit)+' · 주간 리스료 '+money(p.lease):'현재 매각 예상 금액 '+money(planeValue(p))}</p>`,btn(p.kind==='lease'?'리스 반납':'항공기 매각','plane-sell',`data-id="${id}" ${p.readyWeek>G.week||G.over?'disabled':''}`,'danger')+btn('닫기','modal-close','','ghost'),'plane');}
function openSeats(id){const p=G.fleet.find(p=>p.id===id);if(!p)return;setModal(`${p.registration} 객실 구성`,`<p class="note mb">일반석 1석, 비즈니스 1석, 퍼스트 1석은 각각 공간 1, 2, 4를 사용합니다. 사용 가능한 공간은 ${TP[p.type].seats}입니다.</p><div class="seatgrid">${['일반석 Y','비즈니스 J','퍼스트 F'].map((l,i)=>`<div class="field"><label for="seat${i}">${l}</label><input id="seat${i}" data-seat="${i}" type="number" inputmode="numeric" min="0" value="${p.seats[i]}"></div>`).join('')}</div><div id="seatQuote" data-id="${id}"></div><div class="notice mt">변경 후 다음 한 주 운항이 중단됩니다. 개조 비용은 ${money(TP[p.type].seats*450)}입니다.</div>`,btn('취소','modal-close','','ghost')+btn('개조 확정','seats-confirm',`data-id="${id}" id="seatsConfirm"`,'primary'),'seats');refreshSeats();}
function refreshSeats(){const root=$('#seatQuote');if(!root)return;const p=G.fleet.find(x=>x.id===root.dataset.id),seats=[0,1,2].map(i=>Number($('#seat'+i).value)),used=seats[0]+seats[1]*2+seats[2]*4,remaining=TP[p.type].seats-used,valid=seats.every(n=>Number.isInteger(n)&&n>=0)&&remaining>=0&&seats.reduce((n,v)=>n+v,0)>=10;root.innerHTML=`<div class="forecast"><div class="row between"><span>사용 공간 / 최대</span><strong class="${valid?'positive':'negative'}">${used} / ${TP[p.type].seats}</strong></div><p class="note mt">${remaining>=0?'남은 공간 '+remaining+' · 총 '+seats.reduce((n,v)=>n+v,0)+'석':'공간을 초과했습니다.'}</p>${btn('남은 공간을 일반석으로','seats-fill',`data-id="${p.id}"`,'small ghost mt')}</div>`;$('#seatsConfirm').disabled=!valid||G.cash<TP[p.type].seats*450||G.over;}
function openAirportSearch(){setModal('다음 목적지를 찾아보세요',`<div class="formgrid mb"><div class="field"><label for="airportSearch">공항 · 도시 · 국가</label><input id="airportSearch" type="search" placeholder="예: NRT, 도쿄, 일본" autocomplete="off"></div><div class="field"><label for="airportRegion">권역</label><select id="airportRegion"><option value="all">전 세계</option>${[...new Set(AIRPORTS.map(a=>a.region))].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div></div><div class="note mb">${UI.selectedHub||G.hubs[0].id} 출발 기준 · 항공기 항속거리와 무관하게 모든 공항을 표시합니다.</div><div id="airportResults" class="airportresults"></div>`,'','airports');refreshAirportSearch();}
function refreshAirportSearch(){const term=($('#airportSearch')?.value||'').trim().toLowerCase(),region=$('#airportRegion')?.value||'all',hub=UI.selectedHub||G.hubs[0].id;const airports=AIRPORTS.filter(a=>a.id!==hub&&(region==='all'||a.region===region)&&(!term||[a.id,a.name,a.country].some(s=>s.toLowerCase().includes(term)))).sort((a,b)=>distance(hub,a.id)-distance(hub,b.id));$('#airportResults').innerHTML=airports.map(a=>`<button class="airportitem" data-action="airport-select" data-id="${a.id}"><div class="iata">${a.id}</div><div class="grow"><strong>${a.name}</strong><small>${a.country} · ${a.region}</small></div><div class="right"><strong>${num(distance(hub,a.id))} km</strong><small>수요 ${num(marketDemand(G,hub,a.id).reduce((n,v)=>n+v,0))}/주</small></div>${icon('next')}</button>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>';}
function openHubModal(){setModal('새 허브 개설',`<p class="note mb">허브를 개설하면 해당 공항에서 노선을 출발시킬 수 있습니다. 주간 왕복 슬롯 56개로 시작합니다. 항공기는 별도로 배치해야 합니다.</p><label for="newHub">새 허브 공항</label><select id="newHub">${AIRPORTS.filter(a=>!G.hubs.some(h=>h.id===a.id)).map(a=>`<option value="${a.id}">${a.id} · ${a.name} · ${a.country}</option>`).join('')}</select><div id="hubQuote"></div>`,btn('취소','modal-close','','ghost')+btn('허브 개설','hub-confirm','id="hubConfirm"','primary'),'hub');refreshHubQuote();}
function refreshHubQuote(){const id=$('#newHub')?.value;if(!id)return;$('#hubQuote').innerHTML=`<div class="forecast"><div class="costline"><span>개설 비용</span><b class="${G.cash<hubCost(id)?'negative':'positive'}">${money(hubCost(id))}</b></div><div class="costline"><span>주간 허브 운영비</span><b>${money(17000+AP[id].market*1700)}</b></div></div>`;$('#hubConfirm').disabled=G.cash<hubCost(id)||G.over;}
function openSettings(){setModal('저장 및 설정',`<div class="notice green mb">진행 상황은 이 브라우저에 자동 저장됩니다. 같은 주소에서 다시 열면 이어서 할 수 있습니다.</div><div class="settingrow"><div><label>저장 파일 내보내기</label><p>기기를 바꾸거나 Safari 데이터를 지우기 전 백업하세요.</p></div>${btn(icon('download')+' 백업','export','','small')}</div><div class="settingrow"><div><label>저장 파일 가져오기</label><p>현재 진행을 선택한 저장 파일로 교체합니다.</p></div>${btn(icon('upload')+' 불러오기','import','','small ghost')}</div><div class="settingrow"><div><label>게임 안내</label><p>운항시간, 가격, 정비, 승리 조건을 확인하세요.</p></div>${btn('도움말','help','','small ghost')}</div><div class="settingrow"><div><label>새 항공사 설립</label><p>진행 중인 항공사를 초기화합니다.</p></div>${btn('새 게임','newgame','','small danger')}</div><div class="divider"></div><div class="note">SKYWARD · Airline Tycoon · v1.0<br>단일 HTML · 외부 라이브러리, 광고, 추적 코드 없음<br>지도: Natural Earth (Public Domain)<br>아이폰 Safari를 고려한 터치 UI / 실제 기기 검증은 별도 필요<br><br>백그라운드 진행과 온라인 멀티플레이는 없습니다. AI 항공사 3곳과 경쟁하는 싱글 플레이 게임입니다. 저장은 브라우저·주소별로 분리되며 시크릿 모드·사이트 데이터 삭제 시 사라질 수 있습니다.</div>`,btn('닫기','modal-close','','primary'),'settings');}
function openHelp(){setModal('첫 비행을 위한 경영 가이드',`<div class="tourstep"><div class="tournum">1</div><div><h3>노선을 개설하세요</h3><p>네트워크 → 노선 개설. 허브와 목적지를 고르고 항공기를 배정합니다. 처음에는 중단거리 노선의 주 7~14회 왕복을 권합니다. 항공기당 주 126시간, 항속거리, 허브 슬롯 제약이 있습니다.</p></div></div><div class="tourstep"><div class="tournum">2</div><div><h3>운임과 좌석을 조절하세요</h3><p>Y는 일반석, J는 비즈니스, F는 퍼스트입니다. 등급마다 편도 운임을 정할 수 있습니다. 추천 운임은 현재 상태에서 탐색한 값으로, 미래 수익을 보장하지 않습니다. 좌석이 없는 등급의 운임은 매출에 영향을 주지 않습니다.</p></div></div><div class="tourstep"><div class="tournum">3</div><div><h3>1주 진행으로 결산하세요</h3><p>노선 편성은 반복 스케줄입니다. 1주 진행을 누를 때마다 해당 편성으로 운항합니다. 자동 진행은 1× 약 6초, 2× 약 3초, 4× 약 1.5초마다 한 주이며 창을 닫거나 설정창을 열면 멈춥니다. 실제 날짜를 기다릴 필요가 없습니다.</p></div></div><div class="tourstep"><div class="tournum">4</div><div><h3>리스로 늘리고, 정비로 지키세요</h3><p>리스는 구매보다 초기 비용이 낮지만 매주 고정비가 발생합니다. 신규·리스는 1주 대기, 중고는 다음 운항부터 투입됩니다. 여러 노선에 같은 항공기를 배정할 수 있지만 같은 출발 기지여야 합니다. 정비·개조·기지 이전은 다음 한 주 운항을 중단합니다.</p></div></div><div class="tourstep"><div class="tournum">5</div><div><h3>현금을 지키며 제국을 완성하세요</h3><p>순자산 $250M, 기단 15대, 운항 노선 20개를 달성하면 최종 목표를 완료합니다. 그 뒤에도 계속할 수 있습니다. 현금이 4주 연속 음수거나 −$5M 미만이면 지급불능으로 종료됩니다.</p></div></div><div class="divider"></div><div class="reading"><h3>수요와 경쟁은 어떻게 계산하나요?</h3><p>도시 규모, 거리, 권역, 계절, 이벤트를 통해 시장 수요가 정해집니다. 운임, 서비스, 평판, 운항 빈도, 경쟁 항공사의 공급에 따라 일부 수요가 우리 항공사를 선택합니다. 수송객은 유효 좌석 수를 초과하지 않습니다. 좌석이 남거나 가격이 지나치게 높으면 탑승률이 낮아집니다.</p><p>허브 연결은 단순화된 환승 수요 보너스로 반영됩니다. 실제 환승객 여정을 개별 추적하지 않으며 출발·도착 시각을 분 단위로 편성하지는 않습니다. 회사 순이익은 노선 기여이익에서 기체·본사·허브 고정비와 이자를 더 뺀 값입니다.</p><h3>게임 데이터 안내</h3><p>도시·기종 명칭을 이용한 독립 게임입니다. 공항 좌표는 지도 표시용 근사값이며, 수요·운임·항공기 가격·성능은 게임용 설정입니다. 실제 항공 운항 계획이나 투자 판단에 사용할 수 없습니다. Airline Empires의 노선·기단·운임 경영 방식에서 착안했으며, 해당 게임의 코드·화면·자산을 복제하지 않았습니다.</p><p>지도는 Natural Earth의 퍼블릭 도메인 지형 데이터를 포함합니다.</p></div>`,btn('경영 시작하기','modal-close','','primary'),'help');}

const pathCache={};

function drawMap(time){if(!M.canvas||!document.contains(M.canvas)||!G||!M.width)return;const c=M.ctx,w=M.width,h=M.height,s=w/360*M.zoom;c.clearRect(0,0,w,h);c.save();c.lineWidth=.7;c.strokeStyle='#203449';for(let lon=-540;lon<=540;lon+=30){const x=projectMap(lon,0)[0];if(x<0||x>w)continue;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}for(let lat=-60;lat<=80;lat+=20){const y=projectMap(0,lat)[1];if(y<0||y>h)continue;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}c.fillStyle='#1c3243';c.strokeStyle='#345060';c.lineWidth=.55;for(const shift of [-360,0,360]){for(const poly of LAND){c.beginPath();for(let i=0;i<poly.length;i++){const [x,y]=projectMap(poly[i][0],poly[i][1],shift);if(i===0)c.moveTo(x,y);else c.lineTo(x,y);}c.closePath();c.fill();c.stroke();}}const drawRoute=(a,b,color,width,alpha,dash=false,flight=false,index=0)=>{const points=greatCircle(a,b);c.strokeStyle=color;c.lineWidth=width;c.globalAlpha=alpha;c.setLineDash(dash?[3,6]:[]);for(const shift of [-360,0,360]){c.beginPath();points.forEach(([lon,lat],i)=>{const p=projectMap(lon,lat,shift);if(i)c.lineTo(...p);else c.moveTo(...p);});c.stroke();if(flight){const phase=((time/(10000+index*700))+(hash(a+b)%100)/100)%1,n=phase*(points.length-1),i=Math.floor(n),f=n-i,p1=projectMap(...points[i],shift),p2=projectMap(...points[Math.min(i+1,points.length-1)],shift),x=p1[0]+(p2[0]-p1[0])*f,y=p1[1]+(p2[1]-p1[1])*f;if(x< -10||x>w+10||y< -10||y>h+10)continue;c.save();c.translate(x,y);c.rotate(Math.atan2(p2[1]-p1[1],p2[0]-p1[0]));c.globalAlpha=1;c.fillStyle='#cbffef';c.beginPath();c.moveTo(7,0);c.lineTo(-5,-4);c.lineTo(-2,0);c.lineTo(-5,4);c.closePath();c.fill();c.restore();}}c.setLineDash([]);c.globalAlpha=1;};if(UI.showRivals)for(const company of G.ai)for(const r of company.routes)drawRoute(r.a,r.b,company.color,.85,.23,true);const active=G.routes.filter(r=>r.active);active.forEach((r,i)=>drawRoute(r.a,r.b,'#71e8c2',1.6,.85,false,!window.matchMedia('(prefers-reduced-motion: reduce)').matches,i));if(UI.selectedAirport&&UI.selectedAirport!==(UI.selectedHub||G.hubs[0].id)&&!G.routes.some(r=>pairKey(r.a,r.b)===pairKey(UI.selectedHub||G.hubs[0].id,UI.selectedAirport)))drawRoute(UI.selectedHub||G.hubs[0].id,UI.selectedAirport,'#b4d9ec',1.25,.55,true);const connected=new Set(active.flatMap(r=>[r.a,r.b]));const hubs=new Set(G.hubs.map(a=>a.id));const priority=a=>(a.id===UI.selectedAirport?100:0)+(hubs.has(a.id)?90:0)+(connected.has(a.id)?50:0)+a.market;const all=AIRPORTS.map(a=>({a,p:airportPoint(a)})).filter(({p})=>p[0]>-25&&p[0]<w+25&&p[1]>-20&&p[1]<h+20).sort((a,b)=>priority(b.a)-priority(a.a));for(const {a,p:[x,y]} of all.slice().reverse()){const ishub=hubs.has(a.id),sel=UI.selectedAirport===a.id,own=connected.has(a.id);c.fillStyle=ishub?'#f0bd79':own?'#71e8c2':'#6f8ea2';if(ishub||sel){c.globalAlpha=.18;c.beginPath();c.arc(x,y,sel?15:11,0,Math.PI*2);c.fill();c.globalAlpha=1;}c.beginPath();c.arc(x,y,ishub?4.8:sel?5:own?3.8:2.6,0,Math.PI*2);c.fill();if(ishub||sel){c.strokeStyle='#102532';c.lineWidth=1.5;c.stroke();}}const boxes=[];c.font='600 10px -apple-system, BlinkMacSystemFont, sans-serif';for(const {a,p:[x,y]} of all){const important=hubs.has(a.id)||a.id===UI.selectedAirport||connected.has(a.id);if(!important&&M.zoom<2&&a.market<10)continue;if(!important&&M.zoom<4&&a.market<7)continue;const tx=x+8,ty=y-8,rect=[tx-2,ty-10,30,14];if(boxes.some(b=>rect[0]<b[0]+b[2]&&rect[0]+rect[2]>b[0]&&rect[1]<b[1]+b[3]&&rect[1]+rect[3]>b[1]))continue;boxes.push(rect);c.lineWidth=3;c.strokeStyle='#0d1c2b';c.strokeText(a.id,tx,ty);c.fillStyle=hubs.has(a.id)?'#f0ca91':connected.has(a.id)||a.id===UI.selectedAirport?'#c9fff0':'#a2b7c8';c.fillText(a.id,tx,ty);}c.restore();M.dirty=false;}

function runWeek(automatic=false){if(UI.onboarding||modalKind)return;try{const {q,earned}=advanceWeek(G);save();if(G.over){stopAuto();render();setModal('마지막 운항 보고',`<div class="notice red mb">현금 부족으로 항공사 운영이 종료되었습니다.</div><p class="note">운영 기간 ${G.week}주 · 누적 수송객 ${num(G.totalPax)}명<br>매출이 발생해도 리스료와 기단 고정비를 감당하지 못하면 현금이 줄어듭니다. 재무 화면에서 손익과 부채를 확인하세요.</p>`,btn('재무 확인','over-finance','','primary')+btn('새 항공사','newgame','','ghost'),'gameover');return;}render();if(earned.length){earned.forEach(a=>toast(`${a.title} 달성! 보상 ${money(a.reward)}`));if(earned.some(a=>a.id==='empire')){stopAuto();setModal('하늘의 제국을 완성했습니다',`<div class="empty" style="padding:15px">${icon('trophy')}<h2>축하합니다, ${esc(G.name)}!</h2><p class="mt">순자산 $250M · 기단 15대 · 노선 20개를 달성했습니다.<br>이제 더 큰 네트워크를 향해 경영을 계속할 수 있습니다.</p></div>`,btn('계속 경영하기','modal-close','','primary'),'victory');}}else if(!automatic)toast(`${G.week}주차 결산 · 순이익 ${money(q.profit)} · ${num(q.pax)}명 수송`,q.profit<0?'info':'good');}catch(e){stopAuto();toast(e.message,'error');}}
function toggleAuto(){if(autoTimer){stopAuto();return;}if(G.over||modalKind||UI.onboarding)return;autoTimer=setInterval(()=>{if(!document.hidden&&!modalKind)runWeek(true);},6000/UI.autoSpeed);$('.topbar').outerHTML=headerHTML();toast('자동 진행을 시작했습니다. 창을 닫거나 관리 창을 열면 멈춥니다.','info');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;try{switch(a){case 'start':{const name=$('#airlineName').value,hub=$('#startHub').value,diff=$('#difficulty').value;G=newGame(name,hub,diff);UI.onboarding=false;UI.tab='network';UI.selectedHub=hub;UI.selectedAirport=hub;closeModal(true);resetMap();commit('항공사를 설립했습니다. 첫 노선을 개설해보세요.');break;}case 'tab':UI.tab=el.dataset.tab;render();window.scrollTo(0,0);break;case 'modal-close':closeModal();break;case 'advance':runWeek();break;case 'auto':toggleAuto();break;case 'speed':{const running=!!autoTimer;stopAuto();UI.autoSpeed=UI.autoSpeed===1?2:UI.autoSpeed===2?4:1;if(running)toggleAuto();else $('.topbar').outerHTML=headerHTML();break;}case 'settings':openSettings();break;case 'help':openHelp();break;case 'route-new':requireActive();openRoute();break;case 'first-route':requireActive();openRoute(null,recommendedDestination(G.hubs[0].id));break;case 'route-edit':openRoute(el.dataset.id);break;case 'route-target':requireActive();openRoute(null,el.dataset.id);break;case 'route-for-plane':{const p=G.fleet.find(p=>p.id===el.dataset.id);requireActive();openRoute(null,recommendedDestination(p.base),p.id);break;}case 'assignment-add':{const r=UI.editor,p=G.fleet.find(p=>p.base===r.a&&!r.assignments.some(x=>x.plane===p.id)&&distance(r.a,r.b)<=TP[p.type].range&&126-usedHours(G,p.id,r.id)>=tripHours(p.type,r.a,r.b));if(!p)throw Error('이 노선에 추가할 수 있는 항공기가 없습니다. 기지·항속거리·남은 시간을 확인하세요.');r.assignments.push(defaultAssignment(p,r.a,r.b,r.id));$('#assignmentList').innerHTML=assignmentsHTML();refreshRouteForecast();break;}case 'assignment-remove':UI.editor.assignments.splice(Number(el.dataset.index),1);$('#assignmentList').innerHTML=assignmentsHTML();refreshRouteForecast();break;case 'fare-optimize':{UI.editor.prices=suggestPrices(G,UI.editor);for(let k=0;k<3;k++)$('#fare'+k).value=UI.editor.prices[k];refreshRouteForecast();toast('현재 경쟁·수요 기준으로 운임을 조정했습니다.');break;}case 'route-save':{requireActive();const r=UI.editor,isNew=r.id==='new';if(isNew)addRoute(G,r);else updateRoute(G,r);UI.selectedAirport=r.b;closeModal();commit(isNew?'노선을 개설했습니다. 1주 진행으로 운항을 시작하세요.':'노선 변경을 저장했습니다.');if(isNew)window.scrollTo(0,0);break;}case 'route-delete':{const id=el.dataset.id,r=G.routes.find(r=>r.id===id);confirmDialog('이 노선을 폐선할까요?',`<p class="reading">${r.a}–${r.b} 노선을 삭제합니다. 배정된 항공기는 남지만, 개설비는 돌려받을 수 없습니다.</p>`,()=>{requireActive();G.routes=G.routes.filter(r=>r.id!==id);closeModal();commit('노선을 폐선했습니다.');},'폐선 확정',true);break;}case 'airport-search':openAirportSearch();break;case 'airport-select':UI.selectedAirport=el.dataset.id;UI.tab='network';closeModal();M.cx=AP[el.dataset.id].lon;M.cy=AP[el.dataset.id].lat;M.zoom=Math.max(M.zoom,3);render();break;case 'select-hub':UI.selectedHub=el.dataset.id;resetMap();refreshAirportBar();M.dirty=true;toast(el.dataset.id+'를 출발 허브로 선택했습니다.');break;case 'rivals-toggle':UI.showRivals=!UI.showRivals;render();break;case 'map-zoom':zoomMap(Number(el.dataset.factor));break;case 'map-home':resetMap();break;case 'fleet-tab':UI.fleetTab=el.dataset.value;UI.tab='fleet';render();break;case 'plane-buy':requireActive();openBuy(el.dataset.type);break;case 'buy-confirm':{requireActive();buyPlane(G,el.dataset.type,$('#buyMethod').value,$('#buyBase').value);closeModal();UI.tab='fleet';UI.fleetTab='owned';commit('항공기 계약을 완료했습니다.');window.scrollTo(0,0);break;}case 'plane-detail':openPlane(el.dataset.id);break;case 'plane-maintain':{requireActive();const p=G.fleet.find(x=>x.id===el.dataset.id);confirmDialog('중정비를 진행할까요?',`<p class="reading">${p.registration}의 기체 상태가 100%가 됩니다. 비용 ${money(maintenanceCost(p))}가 즉시 차감되고, 다음 한 주 배정된 모든 운항이 중단됩니다.</p>`,()=>{maintain(G,p.id);closeModal();commit('정비를 시작했습니다. 다음 한 주 운항이 중단됩니다.');},'정비 진행');break;}case 'plane-seats':openSeats(el.dataset.id);break;case 'seats-fill':{const p=G.fleet.find(p=>p.id===el.dataset.id);$('#seat0').value=Math.max(0,TP[p.type].seats-Number($('#seat1').value)*2-Number($('#seat2').value)*4);refreshSeats();break;}case 'seats-confirm':requireActive();changeSeats(G,el.dataset.id,[0,1,2].map(i=>Number($('#seat'+i).value)));closeModal();commit('객실 개조를 시작했습니다. 다음 한 주 운항이 중단됩니다.');break;case 'plane-move':{const p=G.fleet.find(p=>p.id===el.dataset.id);setModal(p.registration+' 기지 이전',`<p class="notice mb">현재 노선 배정이 모두 해제됩니다. 이동한 항공기는 다음 한 주 운항을 쉽니다.</p><label for="moveBase">새 기지</label><select id="moveBase">${G.hubs.filter(h=>h.id!==p.base).map(h=>`<option value="${h.id}">${h.id} · ${AP[h.id].name} · 이전비 ${money(120000+distance(p.base,h.id)*12)}</option>`).join('')}</select>`,btn('취소','modal-close','','ghost')+btn('이전 확정','move-confirm',`data-id="${p.id}"`,'primary'),'move');break;}case 'move-confirm':requireActive();movePlane(G,el.dataset.id,$('#moveBase').value);closeModal();commit('기지를 이전했습니다. 새 허브 노선을 배정하세요.');break;case 'plane-sell':{const p=G.fleet.find(p=>p.id===el.dataset.id);const amount=p.kind==='lease'?p.deposit-Math.max(0,12-(G.week-p.acquired))*p.lease:planeValue(p);confirmDialog(p.kind==='lease'?'리스 항공기를 반납할까요?':'항공기를 매각할까요?',`<p class="reading">${p.registration} · ${TP[p.type].name}<br>현금 변동 <strong class="${cls(amount)}">${amount>=0?'+':''}${money(amount)}</strong><br>배정된 노선에서 이 기체가 해제됩니다. 남은 항공기가 없는 노선은 휴항으로 전환됩니다.</p>`,()=>{requireActive();sellPlane(G,p.id);closeModal();commit('항공기 처리를 완료했습니다.');},p.kind==='lease'?'반납 확정':'매각 확정',true);break;}case 'borrow':{const v=Number(el.dataset.value);confirmDialog(money(v)+' 대출 실행',`<p class="reading">연 이자율 ${num(DIFFICULTY[G.difficulty].apr*100,1)}%입니다. 매주 이자가 차감되며 원금은 직접 상환해야 합니다.</p>`,()=>{requireActive();borrow(G,v);closeModal();commit('대출금을 수령했습니다.');},'대출 실행');break;}case 'repay':{requireActive();const amount=el.dataset.value==='all'?Math.min(G.debt,Math.max(0,G.cash)):Number(el.dataset.value);repay(G,amount);commit(money(amount)+'를 상환했습니다.');break;}case 'hub-new':requireActive();openHubModal();break;case 'hub-confirm':requireActive();openHub(G,$('#newHub').value);closeModal();commit('새 허브를 개설했습니다. 항공기를 배치하세요.');break;case 'hub-expand':{const h=G.hubs.find(h=>h.id===el.dataset.id);confirmDialog(h.id+' 허브 확장',`<p class="reading">비용 ${money(1200000*h.level)} · 슬롯 ${h.level*56} → ${(h.level+1)*56}회/주<br>확장된 레벨만큼 주간 허브 운영비도 늘어납니다.</p>`,()=>{requireActive();expandHub(G,h.id);closeModal();commit('허브 슬롯을 확장했습니다.');},'확장 확정');break;}case 'upgrade':{const id=el.dataset.id,u=UPGRADE_DEFS.find(u=>u.id===id);confirmDialog(u.name,`<p class="reading">${u.desc}<br>투자 비용 ${money(Math.round(u.base*1.8**G.upgrades[id]))}</p>`,()=>{requireActive();upgrade(G,id);closeModal();commit('투자를 완료했습니다.');},'투자 확정');break;}case 'rename':setModal('항공사 이름 변경',`<label for="newName">항공사 이름</label><input id="newName" maxlength="24" value="${esc(G.name)}">`,btn('이름 저장','rename-confirm','','primary'),'rename');break;case 'rename-confirm':G.name=$('#newName').value.trim().slice(0,24)||G.name;closeModal();commit('항공사 이름을 변경했습니다.');break;case 'export':exportGame();break;case 'import':$('#importFile').click();break;case 'newgame':confirmDialog('새 항공사를 설립할까요?','<p class="reading">현재 진행 상황이 초기화됩니다. 이어서 할 계획이라면 먼저 설정에서 저장 파일을 내보내세요.</p>',()=>{closeModal(true);G=newGame();UI.tab='network';UI.selectedHub=null;UI.selectedAirport=null;resetMap();render();openWelcome();},'새 게임',true);break;case 'confirm':if(confirmCallback){const fn=confirmCallback;confirmCallback=null;fn();}break;case 'over-finance':closeModal();UI.tab='finance';render();break;default:break;}}catch(err){console.error(err);toast(err.message||'작업을 처리하지 못했습니다.','error');}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='routeSearch'){UI.routeSearch=el.value;$('#routeList').innerHTML=routeListHTML();}if(el.dataset.fare!==undefined||el.dataset.assignment!==undefined&&el.dataset.field==='freq')syncEditor(el);if(el.dataset.seat!==undefined)refreshSeats();if(el.id==='airportSearch'){clearTimeout(searchTimer);searchTimer=setTimeout(refreshAirportSearch,90);}if(el.id==='marketing'){$('#marketingLabel').textContent=money(Number(el.value)*10000);}});
document.addEventListener('change',e=>{const el=e.target;try{if(['routeFrom','routeTo','routeService','routeActive'].includes(el.id)||el.dataset.assignment!==undefined&&el.dataset.field==='plane')syncEditor(el);if(el.id==='routeFilter'){UI.routeFilter=el.value;$('#routeList').innerHTML=routeListHTML();}if(el.id==='buyMethod')refreshBuyQuote();if(el.id==='airportRegion')refreshAirportSearch();if(el.id==='newHub')refreshHubQuote();if(el.id==='difficulty')$('#startCapital').textContent='시작 현금 '+money(DIFFICULTY[el.value].cash)+' + A320neo 1대 · 부채 없음';if(el.id==='marketing'){requireActive();G.marketing=Number(el.value);commit('마케팅 예산을 적용했습니다.');}if(el.id==='autoMaintenance'){requireActive();G.autoMaintenance=el.checked;commit('자동 정비 설정을 저장했습니다.');}}catch(err){toast(err.message,'error');}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>3000000)throw Error('저장 파일이 너무 큽니다. 3MB 이하의 SKYWARD 저장 파일을 선택하세요.');const imported=validateSave(JSON.parse(await file.text()));const apply=()=>{G=imported;UI.onboarding=false;UI.selectedAirport=G.hubs[0].id;UI.selectedHub=G.hubs[0].id;UI.tab='network';closeModal(true);resetMap();commit('저장 파일을 불러왔습니다.');};if(UI.onboarding)apply();else confirmDialog('저장 파일을 불러올까요?',`<p class="reading">${esc(imported.name)} · ${imported.week}주 진행<br>현재 항공사를 선택한 저장 파일로 교체합니다.</p>`,apply,'불러오기');}catch(err){toast('불러오기 실패: '+err.message,'error');}finally{e.target.value='';}});
document.addEventListener('keydown',e=>{if(modalKind){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const focusables=$$('#modalRoot button:not([disabled]), #modalRoot input:not([disabled]), #modalRoot select:not([disabled]), #modalRoot a[href]'),first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}if(!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName)&&e.key===' '){e.preventDefault();runWeek();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAuto();save();}else{M.dirty=true;}});
window.addEventListener('pagehide',()=>{stopAuto();save();});
window.addEventListener('error',e=>{if(document.readyState!=='loading')toast('오류가 발생했습니다. 저장 후 다시 열어주세요.','error');});
function boot(){G=load();if(G){UI.selectedHub=G.hubs[0].id;UI.selectedAirport=G.hubs[0].id;resetMap();render();}else{G=newGame();UI.selectedAirport='ICN';resetMap();render();openWelcome();}requestAnimationFrame(mapFrame);}
window.Skyward={getState:()=>clone(G),getView:()=>({...UI,editor:UI.editor?clone(UI.editor):null}),engine:Engine};
boot();
</script></body></html>
